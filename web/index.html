<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09101f">
  <title>星穹档案室</title>
  <style>
    :root { color-scheme:dark; --night:#070b14; --panel:#111a2bea; --ink:#f4f0e8; --muted:#aeb9cd; --gold:#eacb88; --gold-2:#bd8d45; --blue:#86c8ff; --line:#2b3954; --danger:#ffadb9; --ok:#8ed9b0; --shadow:0 24px 80px #0008; --radius:20px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 12% -10%,#2b466a 0,transparent 34%),radial-gradient(circle at 92% 4%,#52374b 0,transparent 29%),var(--night); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.24; background-image:radial-gradient(#fff .65px,transparent .8px); background-size:38px 38px; }
    a { color:inherit; } button,input,select { font:inherit; } button,a { -webkit-tap-highlight-color:transparent; }
    :focus-visible { outline:3px solid #86c8ff88; outline-offset:3px; }
    .shell { width:min(1180px,calc(100% - 36px)); margin:auto; position:relative; }
    .topbar { min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:24px; border-bottom:1px solid #ffffff12; }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border:1px solid #eacb8866; border-radius:50%; color:var(--gold); background:#151b29; box-shadow:inset 0 0 0 5px #0c1220; }
    .brand strong { font-family:Georgia,"Songti SC",serif; font-size:19px; letter-spacing:.08em; }
    nav { display:flex; align-items:center; gap:4px; padding:5px; border:1px solid var(--line); border-radius:999px; background:#0a101dc7; }
    nav a { padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-size:14px; }
    nav a.active { color:#17150f; background:linear-gradient(135deg,#f5dfa9,var(--gold-2)); font-weight:700; }
    .health { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; white-space:nowrap; }
    .health::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 12px currentColor; }
    .health.ok::before { background:var(--ok); } .health.bad::before { background:var(--danger); }
    main { padding:56px 0 86px; }
    .hero { max-width:800px; margin-bottom:30px; }
    .eyebrow { color:var(--gold); letter-spacing:.22em; text-transform:uppercase; font-size:11px; }
    h1 { margin:10px 0 12px; font:500 clamp(34px,6vw,64px)/1.1 Georgia,"Songti SC",serif; letter-spacing:-.025em; }
    .lede { color:var(--muted); font-size:17px; line-height:1.75; margin:0; max-width:680px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(16px); }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:18px; }
    h2 { margin:0; font:500 26px/1.2 Georgia,"Songti SC",serif; }
    .muted,.meta { color:var(--muted); } .meta { font-size:13px; line-height:1.55; }
    .query-box { padding:18px; } .query-row { display:flex; gap:11px; }
    input,select { width:100%; min-width:0; color:var(--ink); background:#080e19; border:1px solid #3a4966; border-radius:12px; padding:13px 14px; outline:none; }
    input:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #86c8ff20; }
    .primary { flex:0 0 auto; border:0; border-radius:12px; padding:0 22px; cursor:pointer; color:#18160f; font-weight:750; background:linear-gradient(135deg,#f7e2ad,#c6964e); }
    .primary:disabled { cursor:wait; opacity:.58; }
    .examples { display:flex; gap:8px; overflow:auto; padding-top:13px; }
    .option-row { display:flex; align-items:center; gap:8px; padding-top:12px; color:var(--muted); font-size:13px; }
    .option-row input { width:auto; accent-color:var(--gold-2); }
    .identity-strip { margin:14px 0; padding:13px 15px; border:1px solid #4d6382; border-radius:12px; background:#101d31; color:var(--muted); line-height:1.7; }
    .identity-strip strong { color:var(--gold); }
    .chip,.ghost { border:1px solid var(--line); color:var(--muted); background:#162137; cursor:pointer; border-radius:999px; padding:8px 12px; white-space:nowrap; }
    .ghost { border-radius:10px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .workspace { display:grid; gap:17px; } .answer,.content-card { padding:24px; }
    .answer-head,.result-head,.source-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:6px 10px; font-size:12px; letter-spacing:.05em; background:#19304c; color:#b9ddff; }
    .badge.uncertain,.badge.conflicted { background:#492d29; color:#ffc1aa; }
    .answer-text { margin:20px 0; font:500 20px/1.85 Georgia,"Songti SC",serif; white-space:pre-wrap; }
    .claim { border-top:1px solid var(--line); padding-top:18px; margin-top:18px; line-height:1.7; }
    details { margin-top:11px; border:1px solid var(--line); border-radius:12px; background:#0a1120; }
    summary { cursor:pointer; padding:13px 15px; color:var(--gold); } .citation { padding:0 15px 15px; }
    blockquote { margin:10px 0; padding:13px 15px; border-left:3px solid var(--gold); background:#131e32; line-height:1.75; white-space:pre-wrap; }
    .official-link { color:var(--blue); text-underline-offset:3px; }
    .relations { padding:20px 24px; } .relations h3 { margin:0 0 14px; color:var(--muted); font-size:15px; }
    .relation-grid,.metric-grid,.document-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:11px; }
    .relation-card,.metric,.document-card { padding:15px; border:1px solid var(--line); border-radius:13px; background:#0b1323; }
    .relation-card strong { color:var(--gold); }
    .filters { display:grid; grid-template-columns:2fr repeat(3,minmax(130px,1fr)) auto; gap:10px; } .filters .primary { min-height:47px; }
    .result-list { display:grid; gap:13px; margin-top:18px; } .result-card { padding:20px; transition:transform .18s,border-color .18s; }
    .result-card:hover { transform:translateY(-2px); border-color:#526786; } .result-card h3 { margin:4px 0 9px; font-size:18px; }
    .result-card p { margin:13px 0; line-height:1.7; color:#e4e8f2; white-space:pre-wrap; } .score { font-variant-numeric:tabular-nums; color:var(--gold); }
    .card-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .empty,.loading,.error { padding:32px; text-align:center; color:var(--muted); }
    .error { color:var(--danger); border-color:#6f3b46; }
    .loading::before { content:""; display:block; width:26px; height:26px; margin:0 auto 13px; border:2px solid #ffffff20; border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .metric strong { display:block; font:500 32px/1.2 Georgia,serif; color:var(--gold); margin-top:5px; } .metric small { color:var(--muted); }
    .progress { height:7px; border-radius:999px; overflow:hidden; background:#070c16; margin:24px 0 10px; } .progress span { display:block; height:100%; background:linear-gradient(90deg,var(--gold-2),var(--blue)); }
    .facet-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; } .facet { padding:8px 11px; border:1px solid var(--line); border-radius:999px; background:#0b1323; color:var(--muted); font-size:13px; }
    .facet b { color:var(--ink); margin-left:6px; }
    .source-title { margin:8px 0 5px; font:500 clamp(25px,4vw,38px)/1.25 Georgia,"Songti SC",serif; }
    .source-meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; overflow:hidden; border:1px solid var(--line); border-radius:14px; margin:22px 0; background:var(--line); }
    .source-meta div { padding:14px; background:#0c1424; min-width:0; } .source-meta span { display:block; margin-bottom:4px; color:var(--muted); font-size:12px; } .source-meta b { overflow-wrap:anywhere; }
    .document-card h3 { margin:0 0 7px; font-size:16px; } .back { margin-bottom:18px; }
    footer { padding:22px 0 34px; border-top:1px solid #ffffff12; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:20px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:820px) { .health{display:none}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters .primary{grid-column:1/-1;min-height:46px}.source-meta{grid-template-columns:1fr 1fr} }
    @media(max-width:640px) { .shell{width:min(100% - 24px,1180px)}.topbar{align-items:flex-start;padding:16px 0;flex-direction:column;gap:12px}nav{width:100%;overflow:auto;justify-content:flex-start}nav a{flex:1;text-align:center;padding:8px 12px}main{padding:36px 0 60px}.query-row{flex-direction:column}.query-row .primary{min-height:48px}.filters{grid-template-columns:1fr}.filters input,.filters .primary{grid-column:auto}.answer,.content-card,.result-card{padding:18px}.answer-head,.result-head,.source-head,.card-actions{flex-direction:column}.source-meta{grid-template-columns:1fr}footer{flex-direction:column} }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#ask" aria-label="星穹档案室首页"><span class="brand-mark" aria-hidden="true">✦</span><strong>星穹档案室</strong></a>
    <nav aria-label="主要导航"><a href="#ask" data-nav="ask">问答</a><a href="#search" data-nav="search">证据检索</a><a href="#coverage" data-nav="coverage">资料概览</a></nav>
    <div id="health" class="health" role="status">正在连接知识库</div>
  </header>
  <main id="app" class="shell" tabindex="-1"></main>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <footer class="shell"><span>仅依据已收录的米游社官方资料与游戏 Wiki</span><span>资料持续增量更新 · 每条证据可追溯</span></footer>
  <script>
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const labels={explicit:'有据回答',inferred:'证据推理',conflicted:'资料冲突',uncertain:'证据不足',partial:'部分回答'};
    const intentLabels={identity:'身份',playable_form:'可玩形态',relation:'关系',acquisition:'获取方式',temporal:'时间',descriptive:'资料说明',comparison:'比较',unknown:'未分类'};
    const statusLabels={discovered:'已发现',fetched:'已抓取',parsed:'已解析',skipped:'已跳过',failed:'失败'};
    const contextLabels={in_game:'游戏内资料',official_supplement:'官方账号补充',promotional:'宣传资料',unknown:'其他'};
    const kindLabels={wiki_character:'角色',wiki_light_cone:'光锥',wiki_relic:'遗器',wiki_enemy:'敌人',wiki_furniture:'家具',wiki_achievement:'成就',wiki_quest:'任务',wiki_outfit:'装扮',wiki_material:'材料',wiki_consumable:'消耗品',wiki_quest_item:'任务道具',wiki_valuable:'贵重物',wiki_endgame:'逐光捡金',wiki_simulated_universe:'模拟宇宙',wiki_event:'活动',wiki_readable:'阅读物',wiki_special_item:'特殊道具',wiki_shop:'商店',wiki_assignment:'委托',wiki_collectible:'战利品',wiki_dreamscape_pass:'梦境护照',wiki_periodical:'狸狸社刊',wiki_content:'Wiki资料',official_article:'官方文章',official_video:'官方视频'};
    const relationLabels={affiliated_with:'隶属或关联于',appears_in:'出现于',occurs_in:'发生于',uses:'使用',associated_with:'关联于',co_occurs_with:'共同出现'};
    const evidenceLabels={explicit:'原文明示',inferred:'证据推导',candidate:'待审核候选'}, directionLabels={outgoing:'正向关系',incoming:'反向关系'};
    let catalogCache=null;
    async function jsonFetch(url,options={},timeoutMs=25000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);try{const response=await fetch(url,{...options,signal:controller.signal});let data;try{data=await response.json()}catch{throw new Error('服务返回了无法解析的内容')}if(!response.ok)throw new Error(data.detail||`请求失败 (${response.status})`);return data}catch(error){if(error.name==='AbortError')throw new Error('请求超过 25 秒，请稍后重试');throw error}finally{clearTimeout(timer)}}
    function safeUrl(value){try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:'#'}catch{return '#'}}
    function announce(message){$('#announcer').textContent=message} function setActive(route){$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===route))}
    function hero(kicker,title,description){return `<section class="hero"><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p class="lede">${esc(description)}</p></section>`}
    function loading(message='正在读取资料…'){return `<div class="panel loading" role="status">${esc(message)}</div>`} function failure(message){return `<div class="panel error" role="alert">${esc(message)}</div>`}
    function formatTime(value){if(!value)return '未记录';const d=new Date(value);return Number.isNaN(d.valueOf())?value:d.toLocaleString('zh-CN')}
    function citationHTML(c){const neighbours=(c.adjacent_context||[]).map(x=>`<blockquote>${esc(x.text)}</blockquote>`).join('');return `<details><summary>${esc(c.source_title||'未命名来源')} · ${esc(c.section_path||'正文')}</summary><div class="citation"><div class="meta">${esc(kindLabels[c.source_kind]||c.source_kind)} · 版本 ${esc(c.version||'未标注')} · ${esc(contextLabels[c.context_type]||c.context_type)}</div><blockquote>${esc(c.quote)}</blockquote>${neighbours?`<div class="meta">相邻上下文</div>${neighbours}`:''}<a class="official-link" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer">打开官方原页面 ↗</a></div></details>`}
    function relationHTML(group){const cards=(group.relations||[]).map(r=>`<div class="relation-card"><div class="meta">${esc(evidenceLabels[r.evidence_level]||r.evidence_level)} · ${esc(directionLabels[r.direction]||r.direction)}</div><strong>${esc(r.subject_name)}</strong> ${esc(relationLabels[r.predicate]||r.predicate)} <strong>${esc(r.object_name)}</strong>${r.reasoning?`<p class="meta">推理说明：${esc(r.reasoning)}</p>`:''}</div>`).join('');return cards?`<section class="panel relations"><h3>${esc(group.entity.canonical_name)} · 已审核关联</h3><div class="relation-grid">${cards}</div></section>`:''}
    function parseRoute(){const raw=location.hash.slice(1)||'ask',[path,query='']=raw.split('?');if(path.startsWith('source/'))return{name:'source',id:path.slice(7),params:new URLSearchParams(query)};return{name:['ask','search','coverage'].includes(path)?path:'ask',params:new URLSearchParams(query)}}
    async function getCatalog(){return catalogCache||(catalogCache=await jsonFetch('/api/catalog'))}

    function renderAsk(){setActive('ask');$('#app').innerHTML=hero('Evidence-grounded archive','向官方资料提问','先识别问题意图与角色形态，再只依据当前已收录的官方证据回答；资料不足时会明确说明。')+`<section class="panel query-box"><form id="ask-form"><label class="sr-only" for="question">问题</label><div class="query-row"><input id="question" autocomplete="off" maxlength="1000" placeholder="例如：姬子和姬子·启行是什么关系？"><button class="primary" id="ask-submit">回答问题</button></div><label class="option-row"><input id="use-generation" type="checkbox">实验性语言整理（失败时自动回退到确定性答案）</label></form><div class="examples" aria-label="示例问题"><button class="chip" data-q="姬子和姬子·启行是什么关系？">姬子的不同形态</button><button class="chip" data-q="阿格莱雅的一页寄语如何获得？">阿格莱雅的寄语</button><button class="chip" data-q="真珠作为智械的母题是什么？">真珠的母题</button></div></section><div id="ask-result" class="workspace" aria-live="polite"></div>`;$('#ask-form').addEventListener('submit',askQuestion);$$('[data-q]').forEach(button=>button.addEventListener('click',()=>{$('#question').value=button.dataset.q;$('#ask-form').requestSubmit()}))}
    async function askQuestion(event){event.preventDefault();const question=$('#question').value.trim();if(!question)return;const button=$('#ask-submit'),target=$('#ask-result');button.disabled=true;button.textContent='核对中…';target.innerHTML=loading('正在识别问题并核对官方证据…');try{const data=await jsonFetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question,contexts:['in_game','official_supplement'],use_generation:$('#use-generation').checked})});const claims=(data.claims||[]).map(c=>`<div class="claim"><div class="meta">主张类型：${esc(c.type)} · 支持检查：${esc(c.support_check)}</div><div>${esc(c.text)}</div>${(c.citations||[]).map(citationHTML).join('')}</div>`).join(''),related=(data.related_entities||[]).map(relationHTML).join(''),identity=data.identity?`<div class="identity-strip"><strong>${esc(data.identity.narrative_person)}</strong> · 可玩形态：${esc((data.identity.playable_forms||[]).join('、'))}${(data.identity.player_terminology||[]).length?`<br>玩家常用称呼（非官方名称）：${esc(data.identity.player_terminology.join('、'))}`:''}</div>`:'',ambiguity=data.ambiguity?`<div class="identity-strip">需要明确形态：${esc((data.ambiguity.candidates||[]).join('、'))}</div>`:'',partial=data.partial_support?.is_partial?`<div class="identity-strip">已回答：${esc(data.partial_support.supported_parts.join('、'))}<br>证据不足：${esc(data.partial_support.unsupported_parts.join('、'))}</div>`:'';target.innerHTML=`<section class="panel answer"><div class="answer-head"><span class="badge ${esc(data.status)}">${esc(labels[data.status]||data.status)}</span><span class="meta">${esc(intentLabels[data.intent]||data.intent)} · ${esc(data.answer_strategy||'确定性回答')} · 生成：${esc(data.generation_outcome||'未启用')}</span></div>${identity}${ambiguity}${partial}<div class="answer-text">${esc(data.answer)}</div>${claims||'<p class="meta">当前没有足够证据形成可引用主张。可以明确角色形态、换一种问法，或等待资料继续入库。</p>'}</section>${related}`;announce(data.status==='uncertain'?'当前证据不足':`已找到 ${(data.claims||[]).length} 条有据主张`)}catch(error){target.innerHTML=failure(error.message);announce('问答请求失败')}finally{button.disabled=false;button.textContent='回答问题'}}

    async function renderSearch(route){setActive('search');const q=route.params.get('q')||'',kind=route.params.get('kind')||'',context=route.params.get('context')||'',version=route.params.get('version')||'';$('#app').innerHTML=hero('Search the archive','检索原始证据','按资料类型、文本语境或版本收窄结果，并从每条摘录追溯到官方页面。')+`<section class="panel query-box"><form id="search-form" class="filters"><label class="sr-only" for="search-q">检索词</label><input id="search-q" maxlength="1000" value="${esc(q)}" placeholder="输入角色、事件、道具或原文关键词"><label class="sr-only" for="search-kind">资料类型</label><select id="search-kind"><option value="">全部类型</option></select><label class="sr-only" for="search-context">资料语境</label><select id="search-context"><option value="">全部语境</option></select><label class="sr-only" for="search-version">版本</label><select id="search-version"><option value="">全部版本</option></select><button class="primary">开始检索</button></form></section><div id="search-results" aria-live="polite"></div>`;$('#search-form').addEventListener('submit',event=>{event.preventDefault();const p=new URLSearchParams(),values={q:$('#search-q').value.trim(),kind:$('#search-kind').value,context:$('#search-context').value,version:$('#search-version').value};Object.entries(values).forEach(([key,value])=>{if(value)p.set(key,value)});location.hash=`search?${p}`});try{const catalog=await getCatalog();fillSelect('#search-kind',catalog.source_kinds,kind,item=>kindLabels[item.value]||item.value);fillSelect('#search-context',catalog.contexts,context,item=>contextLabels[item.value]||item.value);fillSelect('#search-version',catalog.versions,version,item=>item.value)}catch(error){$('#search-results').innerHTML=failure(`筛选项读取失败：${error.message}`);return}if(!q){$('#search-results').innerHTML='<div class="panel empty">输入关键词后开始检索。你也可以先从“资料概览”查看当前已经收录的类型。</div>';return}await runSearch({q,kind,context,version})}
    function fillSelect(selector,items,selected,label){const select=$(selector);(items||[]).forEach(item=>{const option=document.createElement('option');option.value=item.value;option.textContent=`${label(item)} (${item.count})`;option.selected=item.value===selected;select.append(option)})}
    async function runSearch(filters){const target=$('#search-results');target.innerHTML=loading('正在检索当前证据库…');const params=new URLSearchParams({q:filters.q,limit:'20'});if(filters.kind)params.append('source_kind',filters.kind);if(filters.context)params.append('context',filters.context);if(filters.version)params.set('version',filters.version);try{const data=await jsonFetch(`/api/search?${params}`),results=data.results||[];if(!results.length){target.innerHTML='<div class="panel empty">当前资料中没有匹配证据。请尝试缩短关键词、清除筛选，或等待更多资料入库。</div>';announce('没有找到匹配证据');return}target.innerHTML=`<div class="section-head"><h2>${results.length} 条相关证据</h2><span class="meta">结果基于当前已解析资料</span></div><div class="result-list">${results.map(result=>`<article class="panel result-card"><div class="result-head"><div><div class="meta">${esc(kindLabels[result.source_kind]||result.source_kind)} · ${esc(contextLabels[result.context_type]||result.context_type)} · 版本 ${esc(result.version||'未标注')}</div><h3>${esc(result.title||'未命名来源')}</h3></div><span class="score">${Math.round(Number(result.score||0)*100)}%</span></div><p>${esc(result.text)}</p><div class="card-actions"><span class="meta">${esc(result.section_path||'正文')}${result.speaker?` · ${esc(result.speaker)}`:''}</span><a class="ghost" href="#source/${encodeURIComponent(result.source_id)}">查看来源</a></div></article>`).join('')}</div>`;announce(`找到 ${results.length} 条相关证据`)}catch(error){target.innerHTML=failure(error.message);announce('证据检索失败')}}

    async function renderCoverage(){setActive('coverage');$('#app').innerHTML=hero('Live corpus snapshot','资料覆盖概览','这里展示当前知识库的即时快照。采集与解析在后台继续进行，数字会随资料入库增长。')+`<div id="coverage-content">${loading('正在统计资料覆盖…')}</div>`;try{catalogCache=null;const data=await getCatalog(),statuses=data.source_statuses||{},total=Number(data.counts?.sources||0),parsed=Number(statuses.parsed||0),growing=parsed<total,percent=total?Math.round(parsed/total*100):0;$('#coverage-content').innerHTML=`<section class="panel content-card"><div class="section-head"><div><h2>${growing?'资料仍在增长':'当前批次已处理'}</h2><p class="meta">${growing?'未解析不代表服务异常；搜索会自动使用已经就绪的内容。':'所有已发现来源均已有终态，后续版本仍可增量加入。'}</p></div><span class="badge">${percent}% 已解析</span></div><div class="metric-grid"><div class="metric"><small>已发现来源</small><strong>${total.toLocaleString()}</strong></div><div class="metric"><small>已解析来源</small><strong>${parsed.toLocaleString()}</strong></div><div class="metric"><small>可追溯文档</small><strong>${Number(data.counts?.documents||0).toLocaleString()}</strong></div><div class="metric"><small>证据片段</small><strong>${Number(data.counts?.chunks||0).toLocaleString()}</strong></div></div><div class="progress" aria-label="解析进度 ${percent}%"><span style="width:${percent}%"></span></div><div class="facet-row">${Object.entries(statuses).map(([key,count])=>`<span class="facet">${esc(statusLabels[key]||key)}<b>${Number(count).toLocaleString()}</b></span>`).join('')}</div></section><section class="panel content-card"><div class="section-head"><h2>可检索资料类型</h2><span class="meta">仅统计已解析来源</span></div><div class="facet-row">${(data.source_kinds||[]).map(item=>`<a class="facet" href="#search?kind=${encodeURIComponent(item.value)}">${esc(kindLabels[item.value]||item.value)}<b>${Number(item.count).toLocaleString()}</b></a>`).join('')||'<span class="meta">暂无已解析资料</span>'}</div></section>`;announce('资料覆盖统计已更新')}catch(error){$('#coverage-content').innerHTML=failure(error.message);announce('资料统计读取失败')}}

    async function renderSource(route){setActive('search');$('#app').innerHTML=`<a class="ghost back" href="#search">← 返回检索</a><div id="source-content">${loading('正在读取来源详情…')}</div>`;try{const data=await jsonFetch(`/api/sources/${encodeURIComponent(route.id)}`),source=data.source,documents=data.documents||[];$('#source-content').innerHTML=`<section class="panel content-card"><div class="source-head"><div><div class="eyebrow">${esc(kindLabels[source.source_kind]||source.source_kind)}</div><h1 class="source-title">${esc(source.title||`来源 ${source.external_id}`)}</h1><p class="meta">这是一份只读来源记录，可由下方链接回到官方原页面核验。</p></div><a class="primary ghost" href="${esc(safeUrl(source.page_url))}" target="_blank" rel="noopener noreferrer">打开官方页面 ↗</a></div><div class="source-meta"><div><span>来源编号</span><b>${esc(source.external_id)}</b></div><div><span>版本</span><b>${esc(source.version||'未标注')}</b></div><div><span>处理状态</span><b>${esc(statusLabels[source.status]||source.status)}</b></div><div><span>官方状态</span><b>${esc(source.official_status||'未标注')}</b></div><div><span>抓取时间</span><b>${esc(formatTime(source.fetched_at))}</b></div><div><span>解析时间</span><b>${esc(formatTime(source.parsed_at))}</b></div></div><div class="section-head"><h2>文档结构</h2><span class="meta">${documents.length} 个文档节点</span></div><div class="document-grid">${documents.map(document=>`<article class="document-card"><h3>${esc(document.title||document.document_key)}</h3><div class="meta">${esc(document.section_path)}<br>${Number(document.chunk_count||0)} 个证据片段 · ${document.evidence_eligible?'可用于回答':'仅供存档'}</div></article>`).join('')||'<div class="meta">该来源暂时没有已解析文档。</div>'}</div>${source.last_error?`<div class="error" role="alert">最近处理错误：${esc(source.last_error)}</div>`:''}</section>`;announce('来源详情已载入')}catch(error){$('#source-content').innerHTML=failure(error.message);announce('来源详情读取失败')}}
    function route(){const current=parseRoute();if(current.name==='ask')renderAsk();else if(current.name==='search')renderSearch(current);else if(current.name==='coverage')renderCoverage();else renderSource(current);window.scrollTo({top:0,behavior:'instant'})}
    window.addEventListener('hashchange',route);jsonFetch('/api/health').then(()=>{const node=$('#health');node.textContent='知识库已连接';node.classList.add('ok')}).catch(()=>{const node=$('#health');node.textContent='知识库连接失败';node.classList.add('bad')});route();
  </script>
</body>
</html>
